name: PDF PLUS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect Android Project
        run: |
          echo "PROJECT TREE"
          find . -maxdepth 4 -type f | sort

          echo "SETTINGS FILE"
          cat settings.gradle.kts

          echo "ROOT BUILD FILE"
          cat build.gradle.kts

          echo "ANDROID MODULES"
          find . -name "build.gradle" -o -name "build.gradle.kts"

          echo "ANDROID MANIFEST"
          find . -name AndroidManifest.xml

          echo "GRADLE WRAPPER"
          cat gradle/wrapper/gradle-wrapper.properties || true
